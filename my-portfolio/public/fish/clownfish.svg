<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 130" width="180" height="130">
  <defs>
    <!-- Cute Candy Orange Gradient -->
    <linearGradient id="cuteClownBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="35%" stop-color="#ff6b1a"/>
      <stop offset="85%" stop-color="#f04800"/>
      <stop offset="100%" stop-color="#d63600"/>
    </linearGradient>

    <!-- Rosy Cheek Blush -->
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4488" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff4488" stop-opacity="0"/>
    </radialGradient>

    <!-- Big Kawaii Eye Iris -->
    <radialGradient id="cuteEyeIris" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffaa33"/>
      <stop offset="45%" stop-color="#994d00"/>
      <stop offset="85%" stop-color="#401a00"/>
      <stop offset="100%" stop-color="#1a0a00"/>
    </radialGradient>

    <!-- Fin Gradient -->
    <linearGradient id="cuteFinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa64d"/>
      <stop offset="75%" stop-color="#ff6600"/>
      <stop offset="90%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Pectoral Fin (Behind) -->
  <path d="M 80 68 C 76 80, 64 92, 50 90 C 46 84, 56 72, 70 66 Z" fill="url(#cuteFinGrad)" opacity="0.6"/>

  <!-- Pelvic Fin -->
  <path d="M 68 85 C 64 100, 52 106, 44 102 C 48 94, 56 88, 64 83 Z" fill="url(#cuteFinGrad)" stroke="#222" stroke-width="1.2"/>

  <!-- Caudal / Tail Fin (Chubby rounded fan) -->
  <g>
    <path d="M 136 65 C 148 50, 168 48, 174 56 C 178 62, 178 72, 174 78 C 168 86, 148 84, 136 67 Z" 
          fill="url(#cuteFinGrad)" stroke="#1a1a1a" stroke-width="1.8"/>
    <!-- Cute white & black tip -->
    <path d="M 168 53 C 174 61, 174 73, 168 81" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 165 55 C 170 63, 170 71, 165 79" fill="none" stroke="#222222" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Anal Fin -->
  <path d="M 98 84 C 110 94, 126 92, 132 86 C 130 80, 118 78, 108 78 Z" fill="url(#cuteFinGrad)" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Dorsal Fin (Rounded, friendly crest) -->
  <path d="M 52 40 C 62 25, 88 20, 110 26 C 122 30, 132 40, 130 52 C 118 46, 92 42, 70 42 Z" 
        fill="url(#cuteClownBody)" stroke="#1a1a1a" stroke-width="1.8"/>
  <path d="M 56 36 C 68 22, 92 18, 112 24 C 124 28, 130 36, 128 48" fill="none" stroke="#222222" stroke-width="2.8"/>
  <path d="M 58 34 C 70 20, 94 16, 114 22 C 124 26, 128 34, 126 46" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- CHUBBY PLUMP ROUND BODY -->
  <path d="M 18 64 
           C 16 50, 32 36, 52 32 
           C 78 26, 110 32, 128 46 
           C 140 54, 142 66, 136 74 
           C 126 86, 98 96, 68 96 
           C 42 96, 22 84, 18 64 Z" 
        fill="url(#cuteClownBody)" stroke="#4d1400" stroke-width="1.5"/>

  <!-- 3 CUTE MARSHMALLOW WHITE BANDS WITH CRISP BORDERS -->
  <!-- Band 1: Head Band -->
  <path d="M 44 34 
           C 50 44, 52 60, 48 76 
           C 44 86, 38 88, 35 88 
           C 32 86, 36 74, 38 62 
           C 40 48, 36 40, 34 37 
           C 38 35, 41 34, 44 34 Z" 
        fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Band 2: Middle Saddle Band (curving forward cutely) -->
  <path d="M 84 32 
           C 92 42, 92 56, 94 68 
           C 96 80, 90 90, 82 94 
           C 74 94, 76 84, 74 72 
           C 72 60, 68 50, 72 42 
           C 76 34, 80 32, 84 32 Z" 
        fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Band 3: Tail Base Band -->
  <path d="M 124 50 
           C 128 56, 128 66, 124 74 
           C 118 76, 116 72, 118 66 
           C 119 58, 119 53, 121 51 Z" 
        fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Pectoral Fin (Foreground - cute waving paddle) -->
  <g>
    <path d="M 54 62 C 64 56, 76 60, 82 70 C 84 80, 74 88, 64 86 C 54 84, 50 74, 54 62 Z" 
          fill="url(#cuteFinGrad)" stroke="#1a1a1a" stroke-width="1.8"/>
    <path d="M 72 84 C 80 80, 82 72, 78 66" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 73 85 C 81 81, 83 73, 79 67" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- ROSY CHEEK BLUSH -->
  <ellipse cx="38" cy="68" rx="8" ry="5.5" fill="url(#cheekBlush)"/>

  <!-- CUTE HAPPY MOUTH -->
  <path d="M 16 63 C 14 65, 15 67, 18 68 C 22 69, 25 66, 26 64" fill="none" stroke="#731900" stroke-width="2" stroke-linecap="round"/>
  <!-- Smiling dimple -->
  <path d="M 25 63 C 27 64, 27 66, 26 67" fill="none" stroke="#731900" stroke-width="1.5" stroke-linecap="round"/>

  <!-- GIANT ADORABLE KAWAII EYE -->
  <g>
    <!-- Outer rim / eye frame -->
    <circle cx="32" cy="50" r="10" fill="#260b00"/>
    <!-- Rich Golden-Brown Iris -->
    <circle cx="32" cy="50" r="8.8" fill="url(#cuteEyeIris)"/>
    <!-- Deep Dark Pupil -->
    <circle cx="33" cy="50" r="5.6" fill="#080808"/>
    
    <!-- Big Sparkling Light Glint -->
    <circle cx="30" cy="46.5" r="3.2" fill="#ffffff"/>
    <!-- Second Cute Lower Sparkle Dot -->
    <circle cx="34.8" cy="53.2" r="1.5" fill="#ffffff"/>
    <!-- Tiny Third Sparkle Star/Dot -->
    <circle cx="28.5" cy="51.5" r="0.9" fill="#ffffff" opacity="0.9"/>
    
    <!-- Cute curved upper eyelid lash -->
    <path d="M 23 48 C 26 41, 37 41, 41 46" fill="none" stroke="#2a0d00" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
