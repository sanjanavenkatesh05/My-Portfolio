<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 145" width="170" height="145">
  <defs>
    <!-- Cute Peach / Golden Orange Body -->
    <radialGradient id="cuteDiscusBody" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffc04d"/>
      <stop offset="45%" stop-color="#ff881a"/>
      <stop offset="85%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#b32d00"/>
    </radialGradient>

    <!-- Turquoise Fin Glow -->
    <linearGradient id="cuteTurquoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Rosy Cheek Blush -->
    <radialGradient id="discusBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2266" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2266" stop-opacity="0"/>
    </radialGradient>

    <!-- Big Ruby-Gold Iris -->
    <radialGradient id="cuteDiscusIris" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="80%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#1e050b"/>
    </radialGradient>
  </defs>

  <!-- CAUDAL (TAIL) FIN (Cute Little Fan) -->
  <g>
    <path d="M 124 72 C 138 56, 158 54, 164 62 C 168 68, 168 80, 164 86 C 158 92, 138 90, 124 74 Z" 
          fill="#ffaa33" stroke="#c2410c" stroke-width="1.2"/>
    <path d="M 126 72 L 162 64" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.8"/>
    <path d="M 126 72 L 164 74" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.8"/>
    <path d="M 126 72 L 162 82" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.8"/>
  </g>

  <!-- ROUND CONTINUOUS DORSAL FIN -->
  <path d="M 46 36 C 68 18, 102 16, 126 32 C 135 38, 136 50, 128 58 C 118 48, 95 40, 70 40 Z" 
        fill="#ff881a" stroke="#b32d00" stroke-width="1.2"/>
  <path d="M 48 34 C 70 16, 104 14, 128 30 C 136 36, 137 48, 129 56" fill="none" stroke="url(#cuteTurquoise)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ROUND CONTINUOUS ANAL FIN -->
  <path d="M 60 108 C 84 128, 114 124, 130 104 C 124 98, 112 94, 90 98 Z" 
        fill="#ff7700" stroke="#b32d00" stroke-width="1.2"/>
  <path d="M 62 110 C 86 130, 116 126, 132 106" fill="none" stroke="url(#cuteTurquoise)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- PERFECTLY PLUMP ROUND CIRCULAR DISC BODY -->
  <circle cx="75" cy="72" r="52" fill="url(#cuteDiscusBody)" stroke="#7c1d00" stroke-width="1.5"/>

  <!-- Cute Wavy Gold Body Highlights -->
  <path d="M 38 64 C 52 58, 74 60, 98 58 C 110 58, 118 62, 122 66" fill="none" stroke="#fed7aa" stroke-width="1.5" opacity="0.85" stroke-linecap="round"/>
  <path d="M 35 72 C 50 66, 75 68, 102 66 C 114 66, 120 70, 124 74" fill="none" stroke="#fed7aa" stroke-width="1.5" opacity="0.85" stroke-linecap="round"/>
  <path d="M 38 80 C 52 76, 78 78, 100 76 C 112 76, 118 80, 122 84" fill="none" stroke="#fed7aa" stroke-width="1.5" opacity="0.85" stroke-linecap="round"/>

  <!-- Pectoral Fin -->
  <g>
    <path d="M 58 68 C 66 62, 76 64, 80 72 C 82 78, 76 84, 68 84 C 60 84, 56 76, 58 68 Z" 
          fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/>
    <path d="M 62 70 Q 70 72 74 76" stroke="#ffffff" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Cute Ventral Pelvic Feeler -->
  <path d="M 52 98 C 48 114, 44 126, 38 134" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 52 98 C 48 114, 44 126, 38 134" fill="none" stroke="#67e8f9" stroke-width="1" stroke-linecap="round"/>

  <!-- ROSY CHEEK BLUSH -->
  <ellipse cx="44" cy="75" rx="8" ry="6" fill="url(#discusBlush)"/>

  <!-- CUTE KISSY LIPS / SMILE -->
  <path d="M 23 70 C 19 70, 16 71, 18 73 C 20 75, 23 74, 25 72" fill="none" stroke="#7c1d00" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 25 70 C 27 71, 27 73, 26 74" fill="none" stroke="#7c1d00" stroke-width="1.5" stroke-linecap="round"/>

  <!-- GIANT ADORABLE RUBY-GOLD EYE -->
  <g>
    <circle cx="40" cy="56" r="10.5" fill="#1e050b"/>
    <circle cx="40" cy="56" r="9.2" fill="url(#cuteDiscusIris)"/>
    <circle cx="41" cy="56" r="5.8" fill="#0f0205"/>

    <!-- Double Sparkle Glints -->
    <circle cx="37.8" cy="52.6" r="3.4" fill="#ffffff"/>
    <circle cx="42.8" cy="59.4" r="1.6" fill="#ffffff"/>
    <circle cx="36.5" cy="57.5" r="0.9" fill="#ffffff" opacity="0.9"/>

    <path d="M 31 54 C 34 47, 44 47, 49 52" fill="none" stroke="#1e050b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
