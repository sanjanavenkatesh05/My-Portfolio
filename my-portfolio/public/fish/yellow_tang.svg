<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 130" width="170" height="130">
  <defs>
    <!-- Cute Lemon Drop Yellow Gradient -->
    <linearGradient id="cuteYTBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffb66"/>
      <stop offset="45%" stop-color="#ffea00"/>
      <stop offset="85%" stop-color="#f5be00"/>
      <stop offset="100%" stop-color="#d99400"/>
    </linearGradient>

    <!-- Rosy Cheek Blush -->
    <radialGradient id="ytBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3385" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3385" stop-opacity="0"/>
    </radialGradient>

    <!-- Big Anime Golden Eye -->
    <radialGradient id="cuteYTIris" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#ca8a04"/>
      <stop offset="80%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
  </defs>

  <!-- CAUDAL (TAIL) FIN -->
  <g>
    <path d="M 126 64 C 138 48, 158 46, 164 52 C 168 58, 168 70, 164 76 C 158 82, 138 80, 126 64 Z" 
          fill="#ffea00" stroke="#ca8a04" stroke-width="1.2"/>
    <path d="M 128 64 L 162 56" stroke="#ffffff" stroke-width="0.8" fill="none"/>
    <path d="M 128 64 L 164 64" stroke="#ffffff" stroke-width="0.8" fill="none"/>
    <path d="M 128 64 L 162 72" stroke="#ffffff" stroke-width="0.8" fill="none"/>
    <path d="M 162 52 C 166 58, 166 68, 162 76" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- DORSAL FIN -->
  <path d="M 44 34 C 64 16, 96 14, 124 28 C 132 34, 134 46, 128 54 C 118 44, 96 34, 68 34 Z" 
        fill="#ffea00" stroke="#ca8a04" stroke-width="1.2"/>
  <path d="M 46 32 C 66 14, 98 12, 126 26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- ANAL FIN -->
  <path d="M 56 94 C 78 112, 108 108, 124 88 C 118 82, 108 80, 86 84 Z" 
        fill="#ffea00" stroke="#ca8a04" stroke-width="1.2"/>
  <path d="M 58 96 C 80 114, 110 110, 125 90" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- CHUBBY ROUND LEMON-DROP BODY -->
  <path d="M 16 64 
           C 18 52, 28 40, 48 28 
           C 72 16, 104 20, 124 36 
           C 134 46, 136 56, 130 64 
           C 134 72, 130 82, 120 90 
           C 98 102, 68 102, 44 92 
           C 28 84, 18 76, 16 64 Z" 
        fill="url(#cuteYTBody)" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- White Scalpel Spine Mark -->
  <path d="M 116 64 L 123 61 L 122 67 Z" fill="#ffffff" stroke="#a16207" stroke-width="0.8"/>

  <!-- Pectoral Fin -->
  <g>
    <path d="M 46 60 C 54 54, 66 56, 72 64 C 74 70, 68 76, 58 76 C 50 76, 46 68, 46 60 Z" 
          fill="#fff566" stroke="#ca8a04" stroke-width="1.2"/>
    <path d="M 50 62 Q 60 64, 66 68" stroke="#ffffff" stroke-width="0.8" fill="none"/>
  </g>

  <!-- ROSY CHEEK BLUSH -->
  <ellipse cx="36" cy="65" rx="8" ry="5.5" fill="url(#ytBlush)"/>

  <!-- CUTE SMILE -->
  <path d="M 15 62 C 13 64, 13 66, 16 67 C 20 68, 23 65, 25 63" fill="none" stroke="#713f12" stroke-width="2" stroke-linecap="round"/>
  <path d="M 24 62 C 25 63, 26 65, 25 66" fill="none" stroke="#713f12" stroke-width="1.5" stroke-linecap="round"/>

  <!-- GIANT ADORABLE KAWAII EYE -->
  <g>
    <circle cx="30" cy="48" r="10" fill="#1c1917"/>
    <circle cx="30" cy="48" r="8.8" fill="url(#cuteYTIris)"/>
    <circle cx="31" cy="48" r="5.6" fill="#0c0a09"/>

    <!-- Double Sparkle Glints -->
    <circle cx="27.8" cy="44.8" r="3.2" fill="#ffffff"/>
    <circle cx="32.6" cy="51.2" r="1.5" fill="#ffffff"/>
    <circle cx="26.5" cy="49.5" r="0.9" fill="#ffffff" opacity="0.9"/>

    <path d="M 21 46 C 24 39, 34 39, 39 44" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
